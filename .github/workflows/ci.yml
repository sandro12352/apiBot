name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela la ejecución anterior de la misma rama cuando llega un push nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Misma imagen que docker-compose.yml
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: chatbot
          POSTGRES_DB: chatbotBd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbotBd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Los tests derivan de aquí la BD "chatbotBd_test" y la crean solos
      DATABASE_URL: postgresql://chatbot:chatbot@localhost:5432/chatbotBd

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # /generated/prisma no está en git: hay que generar el cliente
      - run: npx prisma generate --config prisma7.config.ts

      - run: npm run typecheck

      - run: npm test
